<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Advanced Responsive Navbar with Mobile Menu | UI/UX Design</title>
  <!-- Favicon -->
  <link rel="icon" href="imgs/favicon.svg" type="image/svg+xml">
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="overlay" id="overlay"></div>

<!-- ================= NAVBAR ================= -->
<header class="header">
  <div class="container nav">

    <div class="logo">VDK</div>

    <nav class="nav-menu" id="navMenu">
      <div class="menu-close" id="menuClose">
        <i class="ri-close-line"></i>
      </div>

      <a href="#">Home</a>
      <a href="#">Rooms</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>

    <div class="nav-actions">
      <button class="nav-btn btn-login">Login</button>
      <button class="nav-btn btn-book">Book Now</button>

      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-overlay"></div>

  <div class="container hero-content">
    <p class="hero-tag">Luxury Hotel Experience</p>

    <h1>Find Your Perfect <br> Stay Anywhere</h1>

    <p class="hero-sub">
      Discover premium hotels, best prices, and unforgettable experiences worldwide.
    </p>

    <div class="booking-box">
      <div class="input-group">
        <label>Location</label>
        <input type="text" placeholder="Where are you going?" />
      </div>

      <div class="input-group">
        <label>Check In</label>
        <input type="date" />
      </div>

      <div class="input-group">
        <label>Check Out</label>
        <input type="date" />
      </div>

      <button class="search-btn">
        <i class="ri-search-line"></i> Search
      </button>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
